name: Deploy to production

on:
  push: 
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:

  build-push:
    name: Build image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4 
      with:
        role-to-assume: arn:aws:iam::905418022082:role/github-deploy
        aws-region: ap-southeast-1
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Load secrets and save to app.env
      run: aws secretsmanager get-secret-value --secret-id task_js_keys --query SecretString --output text | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: task_js
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
