name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905418022082:role/github-deploy
          aws-region: ap-southeast-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Load secrets and save to app.env
        run: aws secretsmanager get-secret-value --secret-id task_js_keys2 --query SecretString --output text | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: task_js
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      - name: Replace <IMAGE_URI> with actual image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/task_js:latest
          sed "s|<IMAGE_URI>|$IMAGE_URI|g" .github/ecs-task-def-template.json > task-def.json

      - name: Register new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: taskjs-container
          image: ${{ steps.login-ecr.outputs.registry }}/task_js:latest

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          service: taskjs-service
          cluster: cluster-taskjs
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true
