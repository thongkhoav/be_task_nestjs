version: '3.8'

services:
  app:
    build: .
    ports:
      - '3333:3333'
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: task_js
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
